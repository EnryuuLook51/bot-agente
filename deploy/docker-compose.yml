# Bot de agenda en Docker (ASUS). Convenciones del MANUAL: servicio en
# /opt/apps/services/bot-agenda/ con este docker-compose.yml, sin puertos
# publicados (el bot solo sale por polling) y restart: unless-stopped.
# Secretos en agent.env (chmod 600), nunca en Git: TELEGRAM_BOT_TOKEN,
# TELEGRAM_OWNER_ID y GROQ_API_KEY.
services:
  agenda:
    build: .
    image: bot-agenda:local
    container_name: bot-agenda
    restart: unless-stopped
    env_file: agent.env
    environment:
      TZ: America/Lima
      VAULT: /data/vault
      DATOS_DIR: /data/agenda
      MODELO: openai/gpt-oss-120b
    # Sin puertos publicados. Con "compose run --rm agenda check" valida todo.
    volumes:
      # Bóveda sincronizada por Git en el host: SOLO LECTURA. El bot solo lee
      # los .md de /sugerir; así nunca provoca divergencias en el sync.
      - /opt/apps/data/obsidian-vault:/data/vault:ro
      # Datos del bot: horario.json, tareas.json, registro.jsonl, estado.json,
      # respaldos/. Fuera de la bóveda.
      - /opt/apps/data/bot-agenda:/data/agenda
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
